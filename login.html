<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="assets/branding/logo-qpro.png">
  <title>Login – QuickProCV</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
   
   .branding-logo {
  text-align: center; /* This will center the logo if it's not full width */
  padding: 20px 0;    /* Add some vertical spacing around the logo */
  /* You might want to add a background to this div if needed, 
     or adjust its position relative to the header/features */
}

.branding-logo img {
  max-width: 80%;  /* Ensures the logo scales down on smaller screens if its container is small */
  width: 200px;     /* <<<< SET YOUR DESIRED WIDTH HERE. Adjust this value as needed. */
  height: auto;     /* Maintains the image's aspect ratio */
  display: block;   /* Makes margin: auto work for centering */
  margin-left: auto;
  margin-right: auto;
}



    h1 {
      margin-top: -60px;
      font-size: 2.5rem;
      color: #007bff;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
      max-width: 400px;
      width: 100%;
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    p {
      text-align: center;
      margin-top: 16px;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .back-link {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>QuickProCV</h1>
 <div class="branding-logo">
  <img src="assets/branding/logo.png" alt="Q-Pro Logo">
  </div>
  <div class="login-box">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="login-btn">Login</button>
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>
  
  <div class="back-link">
    <a href="landing.html">← Back to Landing Page</a>
  </div>

  <script>
    document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  try {
    const response = await fetch('http://localhost:3002/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const result = await response.json();

    if (!response.ok) {
      alert('Login failed: ' + result.error);
    } else {
      alert('Login successful!');
      localStorage.clear(); // ✅ Clear out previous user before storing new one
      localStorage.setItem('userEmail', email); // ✅ Store fresh login email
      localStorage.setItem('supabaseUserToken', result.data.session.access_token); 
      window.location.href = 'main.html';
    }
  } catch (err) {
    alert('Login error: ' + err.message);
  }
});
  </script>
</body>
</html>
