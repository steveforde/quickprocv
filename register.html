<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="assets/branding/logo-qpro.png">
  <title>Register – QuickProCV</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/> 
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--page-bg-light);
      color: var(--text-color-light);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .branding-logo {
      text-align: center;
      padding: 20px 0;
    }

    .branding-logo img {
      max-width: 80%;
      width: 200px;
      height: auto;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .header-title {
      margin-bottom: 30px;
      font-size: 2.5rem;
      color: var(--accent-color-dynamic);
      text-align: center;
    }

    .auth-box {
      background: var(--card-bg-light);
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      max-width: 450px;
      width: 100%;
      box-sizing: border-box;
    }
    .auth-box h2 {
        text-align: center;
        color: var(--text-color-light);
        margin-top: 0;
        margin-bottom: 25px;
        font-weight: 600;
    }
    .auth-box p {
      text-align: center;
      margin-top: 20px;
      font-size: 0.95rem;
      color: #555;
    }
    :root[data-theme='dark'] .auth-box p { color: #bbb; }
    .auth-box a {
      color: var(--accent-color-dynamic);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-box a:hover { text-decoration: underline; }
    .back-link { margin-top: 25px; font-size: 0.9rem; }
    .back-link a { color: var(--accent-color-dynamic); text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1 class="header-title">QuickProCV</h1>
  <div class="branding-logo">
  <img src="assets/branding/logo.png" alt="Q-Pro Logo">
  </div>
  <div class="auth-box">
    <h2>Create Account</h2>
    <input type="text" id="name" class="form-input" placeholder="Full Name" required />
    <input type="email" id="email" class="form-input" placeholder="Email" required />
    <input type="password" id="password" class="form-input" placeholder="Password" required />
    <button id="register-btn">Register</button>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <div class="back-link">
    <a href="landing.html">← Back to Landing Page</a>
  </div>

  <script>
   document.getElementById('register-btn').addEventListener('click', async () => {
    console.log('Register button clicked at: ' + new Date().toLocaleTimeString()); 

    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    const full_name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!full_name || !email || !password) {
      alert('Please enter full name, email and password.');
      return;
    }
    if (!email.includes('@') || !email.includes('.')) {
      alert('Please enter a valid email address.');
      return;
    }
    if (password.length < 6) {
      alert('Password must be at least 6 characters long.');
      return;
    }

    console.log(`[Register.html] Attempting registration for: ${email}`);

    try {
      const response = await fetch('http://localhost:3002/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, email, password })
      });

      const result = await response.json();

      if (!response.ok) {
        console.error('[Register.html] Registration failed from backend:', response.status, result.error);
        alert('Registration failed: ' + (result.error || 'An unknown error occurred. Please try again.'));
      } else {
        console.log('[Register.html] Registration successful:', result.message);
        alert('Registration successful! Please proceed to login.');
        window.location.href = 'login.html';
      }
    } catch (err) {
      console.error('[Register.html] Registration fetch/network error or JSON parse error:', err);
      alert('Register error: Failed to connect or server returned an invalid response. Please try again.');
    }
  });
  </script>

</body>
</html>
